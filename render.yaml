# Render Blueprint for the Campaign Pulse API (free web service).
# The database is an external Neon Postgres; set DATABASE_URL and CORS_ORIGINS in the Render dashboard.
services:
  - type: web
    name: campaign-pulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: EMAIL_PROVIDER
        value: simulation
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql://...?sslmode=require)
      - key: CORS_ORIGINS
        sync: false # exact Vercel URL, e.g. https://campaign-pulse.vercel.app
